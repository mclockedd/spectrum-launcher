name: Build Application and Make Release

on:
  push:
    tags:
      - "*"

permissions: {}

jobs:
  build_release:
    name: Build Release
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      build-type: Release
    secrets: inherit

  create_release:
    needs: build_release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8

      - name: Grab and store version
        run: echo "VERSION=${GITHUB_REF##*/}" >> "$GITHUB_ENV"

      - name: Package artifacts
        run: |
          set -e
          for d in SpectrumLauncher-Windows-MSVC*; do
            cd "$d"
            NAME="SpectrumLauncher-Windows-MSVC"
            case "$d" in
              *Setup*)    mv SpectrumLauncher-*.exe "../${NAME}-Setup-${VERSION}.exe" ;;
              *Portable*) zip -r -9 "../${NAME}-Portable-${VERSION}.zip" * ;;
              *)          zip -r -9 "../${NAME}-${VERSION}.zip" * ;;
            esac
            cd ..
          done
          ls -la

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref }}
          name: Spectrum Launcher ${{ env.VERSION }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            SpectrumLauncher-Windows-MSVC-${{ env.VERSION }}.zip
            SpectrumLauncher-Windows-MSVC-Portable-${{ env.VERSION }}.zip
            SpectrumLauncher-Windows-MSVC-Setup-${{ env.VERSION }}.exe
